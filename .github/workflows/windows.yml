# The gate on the Windows runner (windows-2022, as in fs-types): fmt, clippy (pedantic) and tests are run here, never cross-built.
# Own steps instead of the reusable check.yml: same flags as there, with --locked and --no-fail-fast.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy/fs-release/actions/setup-rust@v0.0.11
        with:
          components: rustfmt,clippy
          cache-key: windows
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-features --locked --no-fail-fast
