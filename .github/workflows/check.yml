# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      # Software Vulkan (lavapipe): tests/window_draws.rs draws the shell into a picture; a runner has no GPU
      software-gpu: true
