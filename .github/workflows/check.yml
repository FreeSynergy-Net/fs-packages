# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@6ebd3f8f5dfc8a0be08866416169defa48aea8f1 # v0.0.9
    with:
      # Software Vulkan (lavapipe): tests/window_draws.rs draws the shell into a picture; a runner has no GPU
      software-gpu: true
