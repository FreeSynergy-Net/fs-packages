name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write   # the optional container job needs it even when skipped
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@485f74732ddb90965fafcfa37b6a4f6b473dcc6b
    with:
      binaries: fs-packages
      cargo-package: fs-packages
      ignore-binaries: "fs-packages-tuf-publish"   # the TUF publisher is for fs-catalog CI, not for people
      name: fs-packages
      kind: app
      app-id: net.freesynergy.Packages
      macos: false
      linux-formats: "tar.gz,rpm,deb"   # what the store installs (rpm on Fedora, deb on Debian/Ubuntu); AppImage and Arch only slow the build down
      windows-targets: ""   # Unsupported, on purpose: the engine uses Unix symlinks, /proc and Unix file modes, so there is no Windows build (no zip, no exe) until the engine has a Windows strategy
      app-name: FreeSynergy.Packages
      description: "Install, update and extend FreeSynergy programs"
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
