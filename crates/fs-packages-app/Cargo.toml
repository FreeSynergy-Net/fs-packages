[package]
name = "fs-packages-app"
description = "FreeSynergy.Packages, first window: sources, available and installed packages, progress of the running job; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.89"

[dependencies]
fs-packages-core = { path = "../fs-packages-core" }
fs-packages-catalog = { path = "../fs-packages-catalog" }
fs-packages-engine = { path = "../fs-packages-engine" }
fs-packages-pgp = { path = "../fs-packages-pgp" }
fs-packages-sources = { path = "../fs-packages-sources" }
fs-components = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-components-primitives = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.26" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.22", features = ["rpc"] }
