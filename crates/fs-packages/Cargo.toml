[package]
name = "fs-packages"
description = "FreeSynergy.Packages: install, update and extend FreeSynergy programs. Subcommands work like git; the window comes back as a Forms description."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.89"

[[bin]]
name = "fs-packages"
path = "src/main.rs"

[dependencies]
fs-packages-cli = { path = "../fs-packages-cli" }
fs-packages-engine = { path = "../fs-packages-engine" }
fs-packages-core = { path = "../fs-packages-core" }
fs-packages-server = { path = "../fs-packages-server" }
