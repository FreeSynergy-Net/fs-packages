[package]
name = "fs-packages-server"
description = "Cap'n Proto server of FreeSynergy.Packages: the contract store.capnp over a Unix socket, so programs ask the store whether an update exists for them"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_packages_server"

[dependencies]
fs-packages-core = { path = "../fs-packages-core" }
fs-packages-catalog = { path = "../fs-packages-catalog" }
fs-packages-engine = { path = "../fs-packages-engine" }
fs-packages-pgp = { path = "../fs-packages-pgp" }
fs-packages-sources = { path = "../fs-packages-sources" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "71809eaa1e974841762315c7b3187276469ec0bb", version = "0.3.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "cde5b025b3980f7dcc1d5d678ad5aea981015f8a", version = "0.1.4" }
fs-person-service = { git = "https://github.com/FreeSynergy-Net/fs-modules-person", rev = "904282c861ad815ba8de736f7e057827f2b81113", version = "0.0.1", features = ["client"] }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
# The sample persons (`owner::fake`): the SAME source as fs-interfaces above (one fs-* stand in the lock).
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "71809eaa1e974841762315c7b3187276469ec0bb", version = "0.3.0", features = ["fake"] }
tokio = { version = "1", features = ["full"] }
