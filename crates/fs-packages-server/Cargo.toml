[package]
name = "fs-packages-server"
description = "Cap'n Proto server of FreeSynergy.Packages: the contract store.capnp over a Unix socket, so programs ask the store whether an update exists for them"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_packages_server"

[dependencies]
fs-packages-core = { path = "../fs-packages-core" }
fs-packages-catalog = { path = "../fs-packages-catalog" }
fs-packages-engine = { path = "../fs-packages-engine" }
fs-packages-pgp = { path = "../fs-packages-pgp" }
fs-packages-sources = { path = "../fs-packages-sources" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "76df54074910e827ad556ff613335ada49c86de3", version = "0.3.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "459c1e8d1226896cca53c3140f5aa912f43a5305", version = "0.1.4" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
